<h2>用户自主权的定义</h2>
<p class="subtitle">你希望用户能在多大程度上控制AI生成的内容？</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>完全控制</h3>
      <p>用户可以手动编辑每一个节点的文字、添加/删除节点、选择每张图片</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>部分控制</h3>
      <p>用户可以编辑文字内容和选择图片，但不能改变AI生成的结构</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>最小干预</h3>
      <p>用户只能微调文字或替换图片，AI生成的结构保持不变</p>
    </div>
  </div>
</div>
