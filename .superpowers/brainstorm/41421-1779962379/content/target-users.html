<h2>目标用户是谁？</h2>
<p class="subtitle">理解你的用户群体是设计的第一步</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>完全不懂技术的普通用户</h3>
      <p>不会写代码，可能连文件夹都不太会操作，需要完全傻瓜式的操作界面</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>有基础电脑操作能力的用户</h3>
      <p>会用Word、PPT等办公软件，能理解基本的文件操作，但不懂编程</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>对AI有基础了解的用户</h3>
      <p>用过ChatGPT等AI工具，能理解"输入文字→AI生成"的流程</p>
    </div>
  </div>
</div>
